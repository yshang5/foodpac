<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
@font-face { font-family:'SG'; src:url('sg-700.ttf'); font-weight:700; }
@font-face { font-family:'SG'; src:url('sg-500.ttf'); font-weight:500; }
* { margin:0; padding:0; }
body { width:1600px; height:480px; background:transparent; overflow:hidden; }
.wrap { display:flex; align-items:flex-start; height:480px; padding-left:24px; padding-top:40px; }
.icon { width:213px; height:213px; flex:none; margin-right:40px; margin-top:-41px; }
.text { display:flex; flex-direction:column; margin-top:20px; }
.word { font-family:'SG'; font-weight:700; font-size:150px; line-height:1;
        letter-spacing:-0.02em; color:#2e7d32; display:flex; }
.word .pac { color:#f57c00; }
.o1 { position:relative; display:inline-block; }
.o1 svg { position:absolute; width:55px; height:47px; top:-8px; left:50%;
          transform:translateX(-32%); }
.tag { font-family:'SG'; font-weight:500; font-size:39px; letter-spacing:0.345em;
       color:#7c8a80; margin-top:26px; margin-left:6px; }
</style></head>
<body>
<div class="wrap">
  <!-- 手提纸袋 icon -->
  <svg class="icon" viewBox="0 0 100 100">
    <!-- paper handle -->
    <path d="M36 32 C36 13 64 13 64 32" stroke="#f57c00" stroke-width="6"
          fill="none" stroke-linecap="round"/>
    <!-- bag body: near-square -->
    <path d="M14 34 L86 34 L82.5 94 L17.5 94 Z" fill="#2e7d32"
          stroke="#2e7d32" stroke-width="4" stroke-linejoin="round"/>
    <!-- folded top edge -->
    <path d="M14 34 L86 34 L85.5 42 L14.5 42 Z" fill="#1b5e20"/>
    <!-- "food" printed on the bag -->
    <text x="50" y="76" text-anchor="middle" font-family="SG"
          font-weight="700" font-size="27" fill="#ffffff">food</text>
  </svg>
  <div class="text">
    <div class="word">f<span class="o1">o<svg viewBox="0 0 60 48">
        <path d="M6 44 C6 22 22 8 52 6 C52 30 36 44 6 44 Z" fill="#4caf50"/>
        <path d="M6 44 C18 32 32 20 52 6" stroke="#f1f8e9" stroke-width="3.6"
              fill="none" stroke-linecap="round"/>
      </svg></span>od<span class="pac">Pac</span></div>
  </div>
</div>
</body></html>
